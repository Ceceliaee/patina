[package]
name = "patina"
version.workspace = true
edition = "2024"
publish = false

[features]
native-tests = []

[[test]]
name = "pages"
required-features = ["native-tests"]

[[test]]
name = "today"
required-features = ["native-tests"]

[[test]]
name = "lifecycle"
required-features = ["native-tests"]

[[test]]
name = "resources"
required-features = ["native-tests"]

[[test]]
name = "updater"
required-features = ["native-tests"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
patina-windows-integration = { path = "../../crates/windows-integration" }
patina-desktop-protocol = { path = "../../crates/desktop-protocol" }
async-executor = "1"
blocking = "1"
patina-tool-host = { path = "../../crates/tool-host" }
patina-recorder = { path = "../../crates/activity" }
patina-updater = { path = "../../crates/updater" }
async-channel = "2"
winreg = "0.56"
sha2 = "0.10"
windows = { version = "0.62.2", features = [
  "Win32_Security", "Win32_System_Threading", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_Shell", "Win32_Globalization",
  "Win32_System_JobObjects",
  "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_System_LibraryLoader", "Win32_System_RemoteDesktop",
] }

chrono = "0.4"

[dev-dependencies]
patina-test-desktop = { path = "../../crates/test-support" }
tungstenite = "0.28"
windows = { version = "0.62.2", features = [
  "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_UI_Accessibility", "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Direct3D", "Win32_Graphics_Dxgi_Common", "Win32_System_Diagnostics_ProcessSnapshotting",
  "Win32_System_Diagnostics_ToolHelp", "Win32_System_ProcessStatus", "Win32_System_Threading",
    "Win32_System_SystemInformation",
] }
sqlx.workspace = true
tempfile = "3"
tokio = { version = "1", features = ["rt", "time"] }

[[example]]
name = "windows-resource-sample"
path = "examples/windows-resource-sample.rs"
test = true
