[package]
name = "patina-recorder"
version.workspace = true
edition = "2021"
publish = false

[lib]
doctest = false

[dependencies]
patina-storage = { path = "../storage" }
patina-activity-model = { path = "../activity-model" }
patina-windows-integration = { path = "../windows-integration" }
same-file = "1"
percent-encoding = "2"
tokio-util = { version = "0.7", features = ["io"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
quick-xml = "0.41.0"
tempfile = "3.27.0"
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }
arrow = { version = "59.3", default-features = false, features = ["ipc"] }
parquet = { version = "59.3", default-features = false, features = ["arrow"] }
csv = "1.3"
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
# tokio-tungstenite leaves the TLS crypto provider to the host.
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12"] }
crc32fast = "1.4"
sha2="0.10"
base64 = "0.22.1"
chrono = "0.4.44"
patina-i18n = { path = "../i18n" }
futures-util = "0.3"
image = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros", "net", "io-util"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
windows = { version = "0.62.2", features = ["Win32_System_Threading"] }
