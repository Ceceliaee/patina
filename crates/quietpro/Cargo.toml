[package]
name = "quietpro"
version = "0.1.0"
edition = "2024"
publish = false

[features]
test-support = ["gpui-kit/test-support"]
native-tests = []

[[test]]
name = "headless"
required-features = ["test-support"]

[[test]]
name = "controls"
required-features = ["native-tests"]

[dependencies]
gpui-kit = { workspace = true, features = ["assets"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
patina-test-support = { path = "../test-support" }
windows = { version = "0.62.2", features = ["Win32_System_Com", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging"] }
