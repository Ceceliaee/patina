name: Publish Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Existing version tag to publish, for example 1.6.1"
        required: true
        type: string
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
      - "v[0-9]*.[0-9]*.[0-9]*-*"

permissions:
  contents: read

concurrency:
  group: publish-release-${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Verify release tag and CI
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.tag.outputs.commit }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: release
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          $semverPattern = '(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9A-Za-z-][0-9A-Za-z-]*))*))?'

          if ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch") {
            $version = $env:REQUESTED_VERSION
          } else {
            $refName = $env:GITHUB_REF_NAME
            if ($refName -notmatch "^v(?<version>$semverPattern)$") {
              throw "Tag '$refName' is not a release version tag."
            }
            $version = $Matches.version
          }

          if ($version -notmatch "^$semverPattern$") {
            throw "Version '$version' is not a valid SemVer version."
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          Write-Host "Resolved release version: $version"

      - name: Confirm release tag
        shell: pwsh
        run: |
          $tag = "${{ steps.release.outputs.tag }}"

          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $existingTag = git ls-remote --tags origin "refs/tags/$tag"
            if (-not $existingTag) {
              throw "Tag $tag does not exist. Prepare the release commit and push the tag first."
            }
            Write-Host "Tag $tag exists. The workflow will publish from that tag."
          } else {
            Write-Host "Release was triggered by pushed tag $tag."
          }

      - name: Ensure release does not already exist
        id: tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.release.outputs.tag }}"
          $releaseUri = "https://api.github.com/repos/${{ github.repository }}/releases/tags/$tag"
          $headers = @{
            Accept = "application/vnd.github+json"
            Authorization = "Bearer $env:GH_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $releaseExists = $false

          try {
            Invoke-RestMethod -Uri $releaseUri -Headers $headers | Out-Null
            $releaseExists = $true
          } catch {
            $statusCode = [int]$_.Exception.Response.StatusCode
            if ($statusCode -ne 404) {
              throw "Could not determine whether release $tag already exists: $($_.Exception.Message)"
            }
          }

          if ($releaseExists) {
            throw "Release $tag already exists. Published release assets are immutable; prepare a new version instead of rebuilding or overwriting this tag."
          }

          Write-Host "Release $tag does not exist; publication may continue."

          $tagRef = "refs/tags/$tag"
          git fetch --force origin "${tagRef}:${tagRef}"
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to fetch $tag from origin."
          }

          $tagCommit = git rev-parse --verify "${tagRef}^{commit}"
          if ($LASTEXITCODE -ne 0 -or $tagCommit -notmatch '^[0-9a-f]{40}$') { throw "Cannot resolve commit for $tag" }
          if ($env:GITHUB_REF -cne $tagRef -or $tagCommit -cne (git rev-parse HEAD)) {
            throw "Start this workflow from $tagRef at $tagCommit."
          }
          "commit=$tagCommit" >> $env:GITHUB_OUTPUT
          Write-Host "Publishing $tag from $tagCommit"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Require successful main verification for the release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types scripts/release-verification.ts ${{ steps.tag.outputs.commit }}

  version-files:
    name: Check version files
    runs-on: windows-latest
    needs: resolve

    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version

      - name: Validate version files
        shell: pwsh
        run: |
          node --experimental-strip-types scripts/release.ts validate-version-files ${{ needs.resolve.outputs.version }}

  changelog:
    name: Check changelog
    runs-on: windows-latest
    needs: resolve

    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version

      - name: Validate changelog
        run: node --experimental-strip-types scripts/release.ts validate-changelog ${{ needs.resolve.outputs.version }}

  release-notes:
    name: Prepare release notes
    runs-on: windows-latest
    needs: resolve

    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version

      - name: Write release notes
        run: node --experimental-strip-types scripts/release.ts write-release-notes ${{ needs.resolve.outputs.version }} dist-release/release-notes.md

      - name: Upload release notes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-notes
          path: dist-release/release-notes.md
          if-no-files-found: error
          retention-days: 7

  windows-build:
    name: Build Windows installer (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - arch: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    needs: [resolve, version-files, changelog, release-notes]

    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          fetch-depth: 0

      - name: Set up Rust from desktop/rust-toolchain.toml
        shell: pwsh
        working-directory: desktop
        run: |
          rustup set default-host ${{ matrix.target }}
          if ($LASTEXITCODE -ne 0) { throw "Rust host configuration failed" }
          rustup toolchain install --no-self-update
          if ($LASTEXITCODE -ne 0) { throw "Rust installation failed" }
          if ((rustc -vV) -notcontains "host: ${{ matrix.target }}") { throw "Rust host architecture mismatch" }

      - name: Install packaging tools
        shell: pwsh
        run: |
          choco install nsis --version=3.11.0 -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "NSIS installation failed" }
          $archive = Join-Path $env:RUNNER_TEMP 'minisign-0.12-win64.zip'
          Invoke-WebRequest -Uri 'https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-win64.zip' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne '37b600344e20c19314b2e82813db2bfdcc408b77b876f7727889dbd46d539479') { throw "Minisign archive hash mismatch" }
          $toolsDir = Join-Path $env:RUNNER_TEMP 'release-tools'
          Expand-Archive -LiteralPath $archive -DestinationPath $toolsDir
          $architecture = if ('${{ matrix.arch }}' -eq 'x64') { 'x86_64' } else { 'aarch64' }
          $minisign = Join-Path $toolsDir "minisign-win64/$architecture/minisign.exe"
          if (-not (Test-Path -LiteralPath $minisign -PathType Leaf)) { throw "Missing native Minisign binary" }
          "PATINA_MINISIGN=$minisign" >> $env:GITHUB_ENV

      - name: Build and sign installer
        shell: pwsh
        env:
          SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          SIGNING_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (-not $env:SIGNING_PRIVATE_KEY) { throw "Missing updater signing key" }
          $key = Join-Path $env:RUNNER_TEMP 'patina-update-signing.key'
          try {
            $keyText = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($env:SIGNING_PRIVATE_KEY))
            if (-not $keyText.StartsWith('untrusted comment:')) { throw "Expected a Base64-encoded Minisign secret key" }
            [IO.File]::WriteAllText($key, $keyText, [Text.UTF8Encoding]::new($false))
            $env:SIGNING_PRIVATE_KEY = $null
            ./scripts/package-gpui.ps1 -Targets '${{ matrix.target }}' -OutputDirectory bundle-artifact -Makensis "${env:ProgramFiles(x86)}/NSIS/makensis.exe" -Minisign $env:PATINA_MINISIGN -SigningKey $key -SigningPasswordEnvironment SIGNING_PASSWORD -DownloadBaseUrl 'https://github.com/${{ github.repository }}/releases/download/${{ needs.resolve.outputs.tag }}'
            if ($LASTEXITCODE -ne 0) { throw "Installer packaging failed" }
            Copy-Item -LiteralPath 'desktop/target/${{ matrix.target }}/release/patina-gpui.exe' -Destination bundle-artifact/patina-gpui.exe
          } finally {
            if (Test-Path -LiteralPath $key) { Remove-Item -LiteralPath $key -Force }
            $keyText = $null
            $env:SIGNING_PASSWORD = $null
          }

      - name: Upload signed bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-bundle-${{ matrix.arch }}
          path: bundle-artifact
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    runs-on: windows-latest
    needs: [resolve, release-notes, windows-build]
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version

      - name: Download signed bundles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: native-bundle-*
          path: bundle-downloads

      - name: Arrange architecture inputs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-inputs | Out-Null
          Move-Item -LiteralPath bundle-downloads/native-bundle-x64 -Destination release-inputs/x64
          Move-Item -LiteralPath bundle-downloads/native-bundle-arm64 -Destination release-inputs/arm64

      - name: Download release notes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-notes
          path: dist-release

      - name: Prepare release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-release | Out-Null
          $version = "${{ needs.resolve.outputs.version }}"
          node --experimental-strip-types scripts/native-release.ts prepare $version release-inputs dist-release ${{ github.repository }} ${{ needs.resolve.outputs.tag }}

      - name: Verify release assets
        shell: pwsh
        run: |
          $version = "${{ needs.resolve.outputs.version }}"
          node --experimental-strip-types scripts/native-release.ts verify $version release-inputs dist-release ${{ github.repository }} ${{ needs.resolve.outputs.tag }}

      - name: Attest Windows installer
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist-release/Patina_${{ needs.resolve.outputs.version }}_x64-setup.exe

      - name: Attest ARM64 installer
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist-release/Patina_${{ needs.resolve.outputs.version }}_arm64-setup.exe

      - name: Upload release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-assets
          path: |
            dist-release/Patina_${{ needs.resolve.outputs.version }}_x64-setup.exe
            dist-release/Patina_${{ needs.resolve.outputs.version }}_arm64-setup.exe
            dist-release/SHA256SUMS.txt
            dist-release/gpui-latest.json
          if-no-files-found: error
          retention-days: 7

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          name: Patina v${{ needs.resolve.outputs.version }}
          body_path: dist-release/release-notes.md
          draft: false
          prerelease: ${{ contains(needs.resolve.outputs.version, '-') }}
          overwrite_files: false
          files: |
            dist-release/Patina_${{ needs.resolve.outputs.version }}_x64-setup.exe
            dist-release/Patina_${{ needs.resolve.outputs.version }}_arm64-setup.exe
            dist-release/SHA256SUMS.txt
            dist-release/gpui-latest.json

      - name: Verify published bytes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download '${{ needs.resolve.outputs.tag }}' --repo '${{ github.repository }}' --dir published-readback --pattern 'Patina_${{ needs.resolve.outputs.version }}_x64-setup.exe' --pattern 'Patina_${{ needs.resolve.outputs.version }}_arm64-setup.exe' --pattern SHA256SUMS.txt --pattern gpui-latest.json
          if ($LASTEXITCODE -ne 0) { throw "Release readback failed" }
          foreach ($name in @('Patina_${{ needs.resolve.outputs.version }}_x64-setup.exe', 'Patina_${{ needs.resolve.outputs.version }}_arm64-setup.exe', 'SHA256SUMS.txt', 'gpui-latest.json')) {
            if ((Get-FileHash "published-readback/$name").Hash -ne (Get-FileHash "dist-release/$name").Hash) { throw "Published bytes differ: $name" }
          }

  r2:
    name: Sync R2 updater mirror
    runs-on: windows-latest
    needs: [resolve, publish]
    if: ${{ !contains(needs.resolve.outputs.version, '-') }}
    concurrency:
      group: patina-updater-mirror
      cancel-in-progress: false

    steps:
      - name: Check R2 mirror configuration
        id: r2
        shell: pwsh
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
        run: |
          $required = @(
            "R2_ACCOUNT_ID",
            "R2_ACCESS_KEY_ID",
            "R2_SECRET_ACCESS_KEY",
            "R2_BUCKET",
            "R2_PUBLIC_BASE_URL"
          )
          $missing = @()
          foreach ($name in $required) {
            if (-not [Environment]::GetEnvironmentVariable($name)) {
              $missing += $name
            }
          }

          if ($missing.Count -gt 0) {
            "enabled=false" >> $env:GITHUB_OUTPUT
            Write-Host "R2 mirror secrets are not fully configured; skipping R2 sync."
            Write-Host "Missing: $($missing -join ', ')"
          } else {
            "enabled=true" >> $env:GITHUB_OUTPUT
            Write-Host "R2 mirror is configured."
          }

      - name: Checkout release tag
        if: steps.r2.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          fetch-depth: 0

      - name: Set up Node
        if: steps.r2.outputs.enabled == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version

      - name: Download release assets
        if: steps.r2.outputs.enabled == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-assets
          path: dist-release

      - name: Ensure AWS CLI for R2 sync
        if: steps.r2.outputs.enabled == 'true'
        shell: pwsh
        run: |
          if (Get-Command aws -ErrorAction SilentlyContinue) {
            aws --version
            exit 0
          }

          choco install awscli -y --no-progress
          aws --version

      - name: Generate R2 updater manifest
        if: steps.r2.outputs.enabled == 'true'
        shell: pwsh
        env:
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
        run: |
          New-Item -ItemType Directory -Force dist-release/r2 | Out-Null
          node --experimental-strip-types scripts/native-release.ts mirror dist-release/gpui-latest.json '${{ github.repository }}' "$env:R2_PUBLIC_BASE_URL" dist-release/r2/gpui-latest.json

      - name: Upload R2 updater mirror
        if: steps.r2.outputs.enabled == 'true'
        shell: pwsh
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          $version = "${{ needs.resolve.outputs.version }}"
          $r2Endpoint = "https://$env:R2_ACCOUNT_ID.r2.cloudflarestorage.com"
          $latest = Get-Content dist-release/r2/gpui-latest.json -Raw | ConvertFrom-Json
          $objects = aws s3api list-objects-v2 --bucket $env:R2_BUCKET --prefix gpui-latest.json --endpoint-url $r2Endpoint | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "Cannot inspect the current mirror" }
          if (@($objects.Contents | Where-Object Key -eq 'gpui-latest.json').Count -gt 0) {
            $currentManifest = Join-Path $env:RUNNER_TEMP 'current-update-manifest.json'
            aws s3 cp "s3://$env:R2_BUCKET/gpui-latest.json" $currentManifest --endpoint-url $r2Endpoint
            if ($LASTEXITCODE -ne 0) { throw "Cannot read the current mirror" }
            node --experimental-strip-types scripts/native-release.ts mirror-advance dist-release/r2/gpui-latest.json $currentManifest
            if ($LASTEXITCODE -ne 0) { throw "Mirror version cannot advance" }
          }
          foreach ($entry in $latest.platforms.PSObject.Properties) {
            $installerName = [IO.Path]::GetFileName(([uri]$entry.Value.url).AbsolutePath)
            aws s3 cp "dist-release/$installerName" "s3://$env:R2_BUCKET/desktop/releases/v$version/$installerName" --endpoint-url $r2Endpoint --content-type "application/octet-stream"
            if ($LASTEXITCODE -ne 0) { throw "R2 installer upload failed: $installerName" }
            $readback = Join-Path $env:RUNNER_TEMP $installerName
            aws s3 cp "s3://$env:R2_BUCKET/desktop/releases/v$version/$installerName" $readback --endpoint-url $r2Endpoint
            if ($LASTEXITCODE -ne 0) { throw "R2 installer readback failed: $installerName" }
            if ((Get-FileHash $readback).Hash -ne (Get-FileHash "dist-release/$installerName").Hash) { throw "R2 digest mismatch: $installerName" }
          }

          aws s3 cp `
            "dist-release/r2/gpui-latest.json" `
            "s3://$env:R2_BUCKET/gpui-latest.json" `
            --endpoint-url $r2Endpoint `
            --content-type "application/json" `
            --cache-control "no-cache"
          if ($LASTEXITCODE -ne 0) { throw "R2 manifest upload failed" }
          aws s3 cp "s3://$env:R2_BUCKET/gpui-latest.json" "$env:RUNNER_TEMP/gpui-latest-readback.json" --endpoint-url $r2Endpoint
          if ($LASTEXITCODE -ne 0) { throw "R2 manifest readback failed" }
          if ((Get-FileHash "$env:RUNNER_TEMP/gpui-latest-readback.json").Hash -ne (Get-FileHash dist-release/r2/gpui-latest.json).Hash) { throw "R2 manifest bytes differ" }

      - name: Clean old R2 updater mirrors
        if: steps.r2.outputs.enabled == 'true'
        shell: pwsh
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          $version = "${{ needs.resolve.outputs.version }}"
          $currentPrefix = "desktop/releases/v$version/"
          $r2Endpoint = "https://$env:R2_ACCOUNT_ID.r2.cloudflarestorage.com"
          $objects = aws s3api list-objects-v2 `
            --bucket $env:R2_BUCKET `
            --prefix "desktop/releases/" `
            --delimiter "/" `
            --endpoint-url $r2Endpoint | ConvertFrom-Json

          if ($LASTEXITCODE -ne 0) { throw "R2 listing failed" }
          $prefixes = @($objects.CommonPrefixes | ForEach-Object { $_.Prefix })
          foreach ($prefix in $prefixes) {
            if ($prefix -and $prefix -ne $currentPrefix) {
              Write-Host "Removing old R2 mirror prefix: $prefix"
              aws s3 rm "s3://$env:R2_BUCKET/$prefix" --recursive --endpoint-url $r2Endpoint
              if ($LASTEXITCODE -ne 0) { throw "R2 cleanup failed: $prefix" }
            }
          }
