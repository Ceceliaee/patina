name: Publish Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Existing version tag to publish, for example 1.6.1"
        required: true
        type: string
      validation_only:
        description: "Build and verify the selected revision without publishing or updating R2"
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
      - "v[0-9]*.[0-9]*.[0-9]*-*"

permissions:
  contents: read

concurrency:
  group: publish-release-${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve release tag
    runs-on: windows-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      source: ${{ steps.release.outputs.source }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: release
        shell: pwsh
        run: |
          $semverPattern = '(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9A-Za-z-][0-9A-Za-z-]*))*))?'

          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.version }}"
          } else {
            $refName = "${{ github.ref_name }}"
            if ($refName -notmatch "^v(?<version>$semverPattern)$") {
              throw "Tag '$refName' is not a release version tag."
            }
            $version = $Matches.version
          }

          if ($version -notmatch "^$semverPattern$") {
            throw "Version '$version' is not a valid SemVer version."
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          if ("${{ inputs.validation_only }}" -eq "true") {
            "source=${{ github.sha }}" >> $env:GITHUB_OUTPUT
          } else {
            "source=v$version" >> $env:GITHUB_OUTPUT
          }
          Write-Host "Resolved release version: $version"

      - name: Confirm release tag
        if: inputs.validation_only != true
        shell: pwsh
        run: |
          $tag = "${{ steps.release.outputs.tag }}"

          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $existingTag = git ls-remote --tags origin "refs/tags/$tag"
            if (-not $existingTag) {
              throw "Tag $tag does not exist. Prepare the release commit and push the tag first."
            }
            Write-Host "Tag $tag exists. The workflow will publish from that tag."
          } else {
            Write-Host "Release was triggered by pushed tag $tag."
          }

      - name: Ensure release does not already exist
        if: inputs.validation_only != true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.release.outputs.tag }}"
          $releaseUri = "https://api.github.com/repos/${{ github.repository }}/releases/tags/$tag"
          $headers = @{
            Accept = "application/vnd.github+json"
            Authorization = "Bearer $env:GH_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $releaseExists = $false

          try {
            Invoke-RestMethod -Uri $releaseUri -Headers $headers | Out-Null
            $releaseExists = $true
          } catch {
            $statusCode = [int]$_.Exception.Response.StatusCode
            if ($statusCode -ne 404) {
              throw "Could not determine whether release $tag already exists: $($_.Exception.Message)"
            }
          }

          if ($releaseExists) {
            throw "Release $tag already exists. Published release assets are immutable; prepare a new version instead of rebuilding or overwriting this tag."
          }

          Write-Host "Release $tag does not exist; publication may continue."

          $tagRef = "refs/tags/$tag"
          git fetch --force origin "${tagRef}:${tagRef}"
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to fetch $tag from origin."
          }

          $tagCommit = git rev-list -n 1 $tag
          Write-Host "Publishing $tag from $tagCommit"

  version-files:
    name: Version files gate
    runs-on: windows-latest
    needs: resolve

    steps:
      - name: Checkout release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.resolve.outputs.source }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version

      - name: Validate version files
        run: node --experimental-strip-types scripts/release.ts validate-version-files ${{ needs.resolve.outputs.version }}

  changelog:
    name: Changelog gate
    runs-on: windows-latest
    needs: resolve

    steps:
      - name: Checkout release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.resolve.outputs.source }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version

      - name: Validate changelog
        run: node --experimental-strip-types scripts/release.ts validate-changelog ${{ needs.resolve.outputs.version }}

  release-notes:
    name: Release notes artifact
    runs-on: windows-latest
    needs: resolve

    steps:
      - name: Checkout release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.resolve.outputs.source }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version

      - name: Write release notes
        run: node --experimental-strip-types scripts/release.ts write-release-notes ${{ needs.resolve.outputs.version }} dist-release/release-notes.md

      - name: Upload release notes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-notes
          path: dist-release/release-notes.md
          if-no-files-found: error
          retention-days: 7

  frontend:
    name: Frontend release quality gate
    runs-on: windows-latest
    needs: resolve

    steps:
      - name: Checkout release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.resolve.outputs.source }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run frontend quality gate
        run: npm run check

  rust:
    name: Rust release quality gate (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - arch: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    needs: resolve

    steps:
      - name: Checkout release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.resolve.outputs.source }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Set up Rust from rust-toolchain.toml
        shell: pwsh
        run: |
          rustup set default-host ${{ matrix.target }}
          if ($LASTEXITCODE -ne 0) { throw "Rust host configuration failed" }
          rustup toolchain install --no-self-update
          if ($LASTEXITCODE -ne 0) { throw "Rust installation failed" }
          $hostInfo = rustc -vV
          $hostInfo
          if ($hostInfo -notcontains "host: ${{ matrix.target }}") { throw "Rust host architecture mismatch" }

      - name: Install dependencies
        run: npm ci

      - name: Run Rust quality gate
        run: npm run check:rust

      - name: Run isolated runtime smoke
        run: npm run test:tauri-runtime-smoke

      - name: Install RustSec audit tool
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit dependencies
        run: npm run check:dependencies

  build:
    name: Build Tauri bundle (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - arch: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    needs: [resolve, version-files, changelog, release-notes, frontend, rust]

    steps:
      - name: Checkout release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.resolve.outputs.source }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Set up Rust from rust-toolchain.toml
        shell: pwsh
        run: |
          rustup set default-host ${{ matrix.target }}
          if ($LASTEXITCODE -ne 0) { throw "Rust host configuration failed" }
          rustup toolchain install --no-self-update
          if ($LASTEXITCODE -ne 0) { throw "Rust installation failed" }
          $hostInfo = rustc -vV
          $hostInfo
          if ($hostInfo -notcontains "host: ${{ matrix.target }}") { throw "Rust host architecture mismatch" }

      - name: Install dependencies
        run: npm ci

      - name: Ensure updater signing key exists
        shell: pwsh
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            throw "Missing TAURI_SIGNING_PRIVATE_KEY secret."
          }
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Build Tauri bundle
        run: npm run tauri build -- --bundles nsis --target ${{ matrix.target }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Verify installer lifecycle
        shell: pwsh
        run: ./scripts/verify-windows-installer.ps1 -Target '${{ matrix.target }}' -Platform 'windows-${{ matrix.arch == 'arm64' && 'aarch64' || 'x86_64' }}'

      - name: Stage Tauri bundle
        shell: pwsh
        run: |
          $root = "src-tauri/target/${{ matrix.target }}/release"
          New-Item -ItemType Directory -Force bundle-artifact/nsis | Out-Null
          Copy-Item "$root/Patina.exe" bundle-artifact/Patina.exe
          Copy-Item "$root/bundle/nsis/*.exe" bundle-artifact/nsis
          Copy-Item "$root/bundle/nsis/*.exe.sig" bundle-artifact/nsis

      - name: Upload Tauri bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tauri-bundle-${{ matrix.arch }}
          path: bundle-artifact
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    runs-on: windows-latest
    needs: [resolve, release-notes, build]
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Checkout release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.resolve.outputs.source }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version

      - name: Download Tauri bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: tauri-bundle-*
          path: bundle-downloads

      - name: Arrange architecture inputs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-inputs | Out-Null
          Move-Item -LiteralPath bundle-downloads/tauri-bundle-x64 -Destination release-inputs/x64
          Move-Item -LiteralPath bundle-downloads/tauri-bundle-arm64 -Destination release-inputs/arm64

      - name: Reject ARM64 installer on x64 Windows
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem release-inputs/arm64/nsis -Filter '*.exe')
          if ($installers.Count -ne 1) { throw "Expected one ARM64 installer" }
          $destination = Join-Path $env:RUNNER_TEMP 'patina-rejected-arm64'
          $process = Start-Process -FilePath $installers[0].FullName -ArgumentList "/S /D=$destination" -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(180000)) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            throw "Wrong-architecture installer timed out"
          }
          if ($process.ExitCode -ne 1633) { throw "Expected architecture rejection, got $($process.ExitCode)" }
          if (Test-Path (Join-Path $destination 'Patina.exe')) { throw "Wrong-architecture application was installed" }

      - name: Download release notes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-notes
          path: dist-release

      - name: Prepare release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-release | Out-Null
          $version = "${{ needs.resolve.outputs.version }}"
          npm run release:prepare-assets -- $version release-inputs dist-release ${{ github.repository }}

      - name: Verify release assets
        shell: pwsh
        run: |
          $version = "${{ needs.resolve.outputs.version }}"
          npm run release:verify-assets -- $version release-inputs dist-release ${{ github.repository }}

      - name: Attest Windows installer
        if: inputs.validation_only != true
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist-release/Patina_${{ needs.resolve.outputs.version }}_x64-setup.exe

      - name: Attest ARM64 installer
        if: inputs.validation_only != true
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist-release/Patina_${{ needs.resolve.outputs.version }}_arm64-setup.exe

      - name: Upload release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-assets
          path: |
            dist-release/Patina_${{ needs.resolve.outputs.version }}_x64-setup.exe
            dist-release/Patina_${{ needs.resolve.outputs.version }}_arm64-setup.exe
            dist-release/SHA256SUMS.txt
            dist-release/latest.json
          if-no-files-found: error
          retention-days: 7

      - name: Publish GitHub Release
        if: inputs.validation_only != true
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          name: Patina v${{ needs.resolve.outputs.version }}
          body_path: dist-release/release-notes.md
          draft: false
          prerelease: ${{ contains(needs.resolve.outputs.version, '-') }}
          overwrite_files: false
          files: |
            dist-release/Patina_${{ needs.resolve.outputs.version }}_x64-setup.exe
            dist-release/Patina_${{ needs.resolve.outputs.version }}_arm64-setup.exe
            dist-release/SHA256SUMS.txt
            dist-release/latest.json

  r2:
    if: inputs.validation_only != true
    name: Sync R2 updater mirror
    runs-on: windows-latest
    needs: [resolve, publish]

    steps:
      - name: Check R2 mirror configuration
        id: r2
        shell: pwsh
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
        run: |
          $required = @(
            "R2_ACCOUNT_ID",
            "R2_ACCESS_KEY_ID",
            "R2_SECRET_ACCESS_KEY",
            "R2_BUCKET",
            "R2_PUBLIC_BASE_URL"
          )
          $missing = @()
          foreach ($name in $required) {
            if (-not [Environment]::GetEnvironmentVariable($name)) {
              $missing += $name
            }
          }

          if ($missing.Count -gt 0) {
            "enabled=false" >> $env:GITHUB_OUTPUT
            Write-Host "R2 mirror secrets are not fully configured; skipping R2 sync."
            Write-Host "Missing: $($missing -join ', ')"
          } else {
            "enabled=true" >> $env:GITHUB_OUTPUT
            Write-Host "R2 mirror is configured."
          }

      - name: Checkout release tag
        if: steps.r2.outputs.enabled == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.resolve.outputs.source }}
          fetch-depth: 0

      - name: Set up Node
        if: steps.r2.outputs.enabled == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version

      - name: Download release assets
        if: steps.r2.outputs.enabled == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-assets
          path: dist-release

      - name: Ensure AWS CLI for R2 sync
        if: steps.r2.outputs.enabled == 'true'
        shell: pwsh
        run: |
          if (Get-Command aws -ErrorAction SilentlyContinue) {
            aws --version
            exit 0
          }

          choco install awscli -y --no-progress
          aws --version

      - name: Generate R2 updater manifest
        if: steps.r2.outputs.enabled == 'true'
        shell: pwsh
        env:
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
        run: |
          New-Item -ItemType Directory -Force dist-release/r2 | Out-Null
          node --experimental-strip-types scripts/release.ts mirror-manifest dist-release/latest.json '${{ github.repository }}' "$env:R2_PUBLIC_BASE_URL" dist-release/r2/latest.json

      - name: Upload R2 updater mirror
        if: steps.r2.outputs.enabled == 'true'
        shell: pwsh
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          $version = "${{ needs.resolve.outputs.version }}"
          $r2Endpoint = "https://$env:R2_ACCOUNT_ID.r2.cloudflarestorage.com"
          $latest = Get-Content dist-release/r2/latest.json -Raw | ConvertFrom-Json
          foreach ($entry in $latest.platforms.PSObject.Properties) {
            $installerName = [IO.Path]::GetFileName(([uri]$entry.Value.url).AbsolutePath)
            aws s3 cp "dist-release/$installerName" "s3://$env:R2_BUCKET/releases/v$version/$installerName" --endpoint-url $r2Endpoint --content-type "application/octet-stream"
            if ($LASTEXITCODE -ne 0) { throw "R2 installer upload failed: $installerName" }
            $readback = Join-Path $env:RUNNER_TEMP $installerName
            aws s3 cp "s3://$env:R2_BUCKET/releases/v$version/$installerName" $readback --endpoint-url $r2Endpoint
            if ($LASTEXITCODE -ne 0) { throw "R2 installer readback failed: $installerName" }
            if ((Get-FileHash $readback).Hash -ne (Get-FileHash "dist-release/$installerName").Hash) { throw "R2 digest mismatch: $installerName" }
          }

          aws s3 cp `
            "dist-release/r2/latest.json" `
            "s3://$env:R2_BUCKET/latest.json" `
            --endpoint-url $r2Endpoint `
            --content-type "application/json" `
            --cache-control "no-cache"
          if ($LASTEXITCODE -ne 0) { throw "R2 manifest upload failed" }

      - name: Clean old R2 updater mirrors
        if: steps.r2.outputs.enabled == 'true'
        shell: pwsh
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          $version = "${{ needs.resolve.outputs.version }}"
          $currentPrefix = "releases/v$version/"
          $r2Endpoint = "https://$env:R2_ACCOUNT_ID.r2.cloudflarestorage.com"
          $objects = aws s3api list-objects-v2 `
            --bucket $env:R2_BUCKET `
            --prefix "releases/" `
            --delimiter "/" `
            --endpoint-url $r2Endpoint | ConvertFrom-Json

          if ($LASTEXITCODE -ne 0) { throw "R2 listing failed" }
          $prefixes = @($objects.CommonPrefixes | ForEach-Object { $_.Prefix })
          foreach ($prefix in $prefixes) {
            if ($prefix -and $prefix -ne $currentPrefix) {
              Write-Host "Removing old R2 mirror prefix: $prefix"
              aws s3 rm "s3://$env:R2_BUCKET/$prefix" --recursive --endpoint-url $r2Endpoint
              if ($LASTEXITCODE -ne 0) { throw "R2 cleanup failed: $prefix" }
            }
          }
