name: PR Intake

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: pr-intake-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  intake:
    name: Pull request intake gate
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout trusted base revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch pull request head without checking it out
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          git fetch --no-tags origin "pull/${PR_NUMBER}/head:refs/remotes/pr-intake/head"
          test "$(git rev-parse refs/remotes/pr-intake/head)" = "${HEAD_SHA}"

      - name: Install repository Rust toolchain
        run: rustup toolchain install --no-self-update

      - name: Run trusted pull request intake gate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        shell: bash
        run: >-
          cargo xtask ci intake
          --base "${BASE_SHA}"
          --head "${HEAD_SHA}"
          --body-env PR_BODY
          --require-pr-body
