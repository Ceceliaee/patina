name: Verify

on:
  push:
    branches:
      - main
  workflow_run:
    workflows:
      - PR Intake
    types:
      - completed
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to verify after maintainer review
        required: false
        type: string

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend checks
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request') ||
      (github.event_name == 'workflow_dispatch' && inputs.pr_number != '')
    runs-on: windows-latest

    steps:
      - name: Checkout push revision
        if: github.event_name == 'push'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Checkout pull request revision
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/pull/${{ github.event.workflow_run.pull_requests[0].number }}/head

      - name: Checkout manually selected pull request revision
        if: github.event_name == 'workflow_dispatch' && inputs.pr_number != ''
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/pull/${{ inputs.pr_number }}/head

      - name: Install pinned pnpm
        shell: pwsh
        run: |
          $packageManager = (Get-Content package.json -Raw | ConvertFrom-Json).packageManager
          npm install --global $packageManager
          if ($LASTEXITCODE -ne 0) { throw "pnpm installation failed" }

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend quality gate
        run: pnpm run check

      - name: Upload core risk coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: core-risk-coverage
          path: artifacts/coverage
          if-no-files-found: error

  rust-quality:
    name: Rust checks (${{ matrix.arch }})
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request') ||
      (github.event_name == 'workflow_dispatch' && inputs.pr_number != '')
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - arch: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc

    steps:
      - name: Checkout push revision
        if: github.event_name == 'push'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Checkout pull request revision
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/pull/${{ github.event.workflow_run.pull_requests[0].number }}/head

      - name: Checkout manually selected pull request revision
        if: github.event_name == 'workflow_dispatch' && inputs.pr_number != ''
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/pull/${{ inputs.pr_number }}/head

      - name: Install pinned pnpm
        shell: pwsh
        run: |
          $packageManager = (Get-Content package.json -Raw | ConvertFrom-Json).packageManager
          npm install --global $packageManager
          if ($LASTEXITCODE -ne 0) { throw "pnpm installation failed" }

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust from rust-toolchain.toml
        shell: pwsh
        run: |
          rustup set default-host ${{ matrix.target }}
          if ($LASTEXITCODE -ne 0) { throw "Rust host configuration failed" }
          rustup toolchain install --no-self-update
          if ($LASTEXITCODE -ne 0) { throw "Rust installation failed" }
          $hostInfo = rustc -vV
          if ($hostInfo -notcontains "host: ${{ matrix.target }}") { throw "Rust host architecture mismatch" }

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Rust quality gate
        run: pnpm run check:rust

      - name: Install RustSec audit tool
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit JavaScript and Rust dependencies
        run: pnpm run check:dependencies

  tauri-runtime-smoke:
    name: Tauri runtime smoke
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request') ||
      (github.event_name == 'workflow_dispatch' && inputs.pr_number != '')
    runs-on: windows-latest
    # Include runner setup and dependency installation before the runtime step.
    timeout-minutes: 25

    steps:
      - name: Checkout push revision
        if: github.event_name == 'push'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Checkout pull request revision
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/pull/${{ github.event.workflow_run.pull_requests[0].number }}/head

      - name: Checkout manually selected pull request revision
        if: github.event_name == 'workflow_dispatch' && inputs.pr_number != ''
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/pull/${{ inputs.pr_number }}/head

      - name: Install pinned pnpm
        shell: pwsh
        run: |
          $packageManager = (Get-Content package.json -Raw | ConvertFrom-Json).packageManager
          npm install --global $packageManager
          if ($LASTEXITCODE -ne 0) { throw "pnpm installation failed" }

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust from rust-toolchain.toml
        run: rustup toolchain install --no-self-update

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run isolated runtime smoke
        # The test reserves eight minutes for a cold Rust build; leave time for
        # WebView startup, assertions and cleanup without sharing the setup budget.
        timeout-minutes: 15
        run: pnpm run test:tauri-runtime-smoke
