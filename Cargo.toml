[workspace]
members = ["xtask", "apps/*", "crates/*"]
default-members = ["xtask"]
exclude = ["vendor/accesskit_windows", "vendor/gpui-platform/fast", "vendor/gpui-platform/pre", "vendor/gpui-pre-windows", "plugins/bundled", "plugins/counter", "examples/remote-status-bridge-worker"]
resolver = "3"

[workspace.package]
version = "1.10.0"

[workspace.dependencies]
embed-resource = "3.0.12"
gpui-kit = { version = "=0.9.1", default-features = false }
sqlx = { git = "https://github.com/transact-rs/sqlx", rev = "10462fa4414c6c7f1ed1d39bb31678e3b726878c", default-features = false, features = ["sqlite", "runtime-tokio", "derive", "migrate"] }

# Return UIA_E_ELEMENTNOTAVAILABLE when a geometry request outlives its HWND.
[patch.crates-io]
accesskit_windows = { path = "vendor/accesskit_windows" }
gpui-fast-platform = { path = "vendor/gpui-platform/fast" }
gpui-pre-platform = { path = "vendor/gpui-platform/pre" }
gpui-pre-windows = { path = "vendor/gpui-pre-windows" }

[profile.dev]
debug = "line-tables-only"
incremental = false
